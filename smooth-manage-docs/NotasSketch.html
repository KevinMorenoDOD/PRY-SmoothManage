<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Notes</title>
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f6f6;--sf:#fff;--sf2:#e8eff0;--bd:#cbdada;--tx:#1b2828;--mu:#667676;--ac:#2a8f89;--acs:#2a8f8920;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#141414;--sf:#1c1c1c;--sf2:#262626;--bd:#2d4b49;--tx:#e6e6e6;--mu:#8c8c8c;--ac:#3baba5;--acs:#3baba526}}
:root[data-theme=dark]{--bg:#141414;--sf:#1c1c1c;--sf2:#262626;--bd:#2d4b49;--tx:#e6e6e6;--mu:#8c8c8c;--ac:#3baba5;--acs:#3baba526}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font:14px/1.5 'Work Sans',system-ui,sans-serif;overflow:hidden}
button,input,textarea{font:inherit;color:inherit}button{cursor:pointer}
#app{display:flex;gap:10px;padding:10px;height:100%}
.box{background:var(--sf);border:1px solid var(--bd);border-radius:18px}
.sp{flex:1}
nav{width:52px;transition:width .2s;padding:10px 8px;display:flex;flex-direction:column;gap:6px;overflow:hidden;flex:none}
nav.open{width:180px}
nav button{display:flex;align-items:center;gap:12px;height:38px;padding:0 9px;border:0;border-radius:12px;background:none;color:var(--ac);font-weight:600;white-space:nowrap}
nav button.on{background:var(--acs);color:var(--tx);box-shadow:inset 0 0 0 1px var(--ac)}
.av{width:30px;height:30px;border-radius:50%;background:var(--ac);color:#fff;font:700 11px/30px 'Work Sans';text-align:center;margin-left:3px;flex:none}
aside{width:var(--sw,270px);flex:none;padding:14px;display:flex;flex-direction:column;gap:12px;overflow:hidden}
.hd{display:flex;align-items:center;gap:6px}.hd b{margin-left:4px}
.lg{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-weight:700;color:var(--ac);background:var(--acs);border:1px solid var(--ac)}
.ib{border:0;background:none;color:var(--mu);display:flex;padding:5px;border-radius:8px}.ib:hover{background:var(--sf2);color:var(--ac)}
.sr{display:flex;gap:8px;align-items:center;padding:0 12px;height:36px;border:1px solid var(--bd);border-radius:18px;color:var(--mu)}
.sr input{flex:1;border:0;background:none;outline:0;min-width:0}
#tree{overflow-x:hidden;overflow-y:auto;flex:1;padding:2px;border-radius:12px}
#tree.droproot{background:var(--acs);box-shadow:inset 0 0 0 1px var(--ac)}
.r{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:10px;cursor:pointer;color:var(--mu);white-space:nowrap;user-select:none}
.r:hover{background:var(--sf2)}.r.f{color:var(--tx);font-weight:500}
.r.sel{background:var(--sf2)}
.r.on{background:var(--acs);box-shadow:inset 0 0 0 1px var(--ac);color:var(--tx);font-weight:600}
.r.drop{background:var(--acs);box-shadow:inset 0 0 0 1.5px var(--ac)}
.r.dg{opacity:.4}
.rn{flex:1;min-width:0;background:var(--bg);border:1px solid var(--ac);border-radius:6px;padding:1px 6px;outline:0;font-weight:500}
.ch{display:flex;transition:transform .15s}.ch.o{transform:rotate(90deg)}
.nx{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.rb.dl:hover{color:#e5736b}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;gap:14px;align-items:center;background:var(--sf);border:1px solid var(--ac);border-radius:16px;padding:10px 16px;box-shadow:0 8px 24px #0006;z-index:9;max-width:90vw}
.toast button{border:0;background:none;color:var(--ac);font-weight:600}
.rb{display:none;flex:none;color:var(--mu);padding:2px;border-radius:6px}
#rz{width:6px;margin:0 -8px;flex:none;cursor:col-resize;position:relative;z-index:2;touch-action:none;border-radius:3px}
#rz::before{content:'';position:absolute;inset:0 -4px}
#rz:hover,#rz.on{background:var(--ac);opacity:.5}
body.rs{user-select:none;cursor:col-resize}
.tab{flex:none}.tn{max-width:200px;overflow:hidden;text-overflow:ellipsis}
.tab.il{box-shadow:inset 3px 0 0 var(--ac)}.tab.ir{box-shadow:inset -3px 0 0 var(--ac)}.tab.tdg{opacity:.4}.r:hover .rb{display:flex}.rb:hover{color:var(--ac);background:var(--sf)}
#bt{outline:0;border-radius:6px;padding:1px 6px;cursor:text}#bt:hover{background:var(--sf2)}#bt:focus{background:var(--sf2);box-shadow:inset 0 0 0 1px var(--ac)}
main{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.tabs{display:flex;gap:6px;overflow-x:auto;min-height:40px}
.tab{display:flex;align-items:center;gap:8px;padding:0 14px;height:38px;border:1px solid var(--bd);border-radius:19px;background:var(--sf);cursor:pointer;white-space:nowrap;color:var(--mu)}
.tab.on{border-color:var(--ac);color:var(--tx);font-weight:600}
.cx{display:flex;border-radius:50%}.cx:hover{color:var(--ac)}
.ed{flex:1;min-height:0;display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:10px;padding:10px 18px;color:var(--mu);font-size:13px}
.bar b{color:var(--tx);font-weight:600}
.seg{display:flex;padding:3px;border:1px solid var(--bd);border-radius:16px}
.seg button{border:0;background:none;padding:3px 12px;border-radius:13px;font-size:12px;font-weight:600;color:var(--mu)}
.seg button.on{background:var(--acs);color:var(--ac)}
.doc{flex:1;overflow:auto;padding:12px 40px 28px}
.doc>*{max-width:720px;margin-inline:auto}
textarea{display:block;width:100%;height:100%;min-height:60vh;background:none;border:0;outline:0;resize:none;font:14px/1.75 ui-monospace,Menlo,Consolas,monospace}
.stt{padding:8px 18px;color:var(--mu);font-size:12px;border-top:1px solid var(--bd)}
.em{display:grid;place-items:center;height:100%;color:var(--mu);text-align:center;padding:16px}
article h1{font-size:30px;margin:6px 0 14px}article h2{font-size:21px;margin:22px 0 8px}article h3{font-size:17px;margin:16px 0 6px}
article p,article ul{margin:8px 0;line-height:1.7}article ul{padding-left:22px}
article code{background:var(--sf2);padding:1px 6px;border-radius:6px;font-size:13px}
article blockquote{border-left:3px solid var(--ac);background:var(--acs);padding:8px 14px;border-radius:0 10px 10px 0;margin:12px 0}
.wl{color:var(--ac);font-weight:500;cursor:pointer}.wl:hover{text-decoration:underline}
.tg{color:var(--ac);background:var(--acs);padding:0 7px;border-radius:10px;font-size:12px;font-weight:600}
.tl{list-style:none;padding:0!important}.tl li{display:flex;gap:10px;align-items:center}
.tl i{width:16px;height:16px;border:1.5px solid var(--ac);border-radius:5px;flex:none}
.tl .dn i{background:var(--ac)}.tl .dn{text-decoration:line-through;color:var(--mu)}
@media(max-width:820px){aside,#rz{display:none}.doc{padding:12px 18px}}
</style></head><body>
<div id="app">
<nav id="nv" class="box"></nav>
<aside class="box">
 <div class="hd"><div class="lg">S</div><b>SmoothManage</b><span class="sp"></span>
  <button class="ib" id="new" title="New note" data-ic="nplus"></button>
  <button class="ib" id="nf" title="New folder" data-ic="fplus"></button></div>
 <label class="sr"><span data-ic="search"></span><input id="q" placeholder="Search notes…"></label>
 <div id="tree"></div>
</aside>
<div id="rz" title="Drag to resize (double-click to reset)"></div>
<main>
 <div id="tabs" class="tabs"></div>
 <div class="box ed">
  <div class="bar"><span id="bc"></span><span class="sp"></span><div class="seg"><button data-m="ed">Edit</button><button data-m="rd">Read</button></div><button class="ib" id="dn" title="Delete note" data-ic="trash"></button></div>
  <div id="doc" class="doc"></div>
  <div id="st" class="stt"></div>
 </div>
</main>
</div>
<script>
const FD='<path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/>',
NT='<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/>';
const P={proj:'<path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z"/><path d="M8 10v4"/><path d="M12 10v2"/><path d="M16 10v6"/>',
note:NT+'<path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/>',
task:'<rect width="18" height="18" x="3" y="3" rx="2"/><path d="m9 12 2 2 4-4"/>',
trash:'<path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/>',pencil:'<path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/>',menu:'<path d="M4 6h16M4 12h16M4 18h16"/>',search:'<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
chev:'<path d="m9 18 6-6-6-6"/>',x:'<path d="M18 6 6 18M6 6l12 12"/>',folder:FD,
fplus:'<path d="M12 10v6"/><path d="M9 13h6"/>'+FD,nplus:NT+'<path d="M12 11v6"/><path d="M9 14h6"/>'};
const ic=(k,s=18)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none">${P[k]}</svg>`;
const $=s=>document.querySelector(s);
$('#nv').innerHTML=`<button id="tg">${ic('menu')}<span>Menu</span></button>`+[['proj','Projects'],['note','Notes'],['task','Tasks']].map(([k,l])=>`<button class="${k=='note'?'on':''}">${ic(k)}<span>${l}</span></button>`).join('')+'<div class="sp"></div><div class="av">TÚ</div>';
document.querySelectorAll('[data-ic]').forEach(e=>e.innerHTML=ic(e.dataset.ic,e.dataset.ic.endsWith('plus')?20:18));

const K='sm-notes-v1';
let N={
 brief:{n:'Product brief',f:'Projects/Project Alpha',b:'# Product brief\n\nAn app to manage **notes, tasks and projects** in one place.\n\n## Goals\n- Ship v1.0\n- Reach 500 users\n\nContinues in [[Launch plan]] #product'},
 plan:{n:'Launch plan',f:'Projects/Project Alpha',b:'# Launch plan\n\n## Goal\nShip v1.0 before the end of the quarter. We start from the [[Product brief]].\n\n## Tasks\n- [x] Lock the MVP scope\n- [ ] Write the landing page copy\n- [ ] Test the payment flow\n\n> Decision: the calendar is postponed to v1.1\n\nWrite in *markdown* with `code`, lists and #work.'},
 d6:{n:'2026-10-06',f:'Daily notes',b:'# 2026-10-06\n\nReview the [[Launch plan]] with the team.'},
 d5:{n:'2026-10-05',f:'Daily notes',b:'# 2026-10-05\n\n- Define priorities\n- Talk to design'},
 idea:{n:'Loose ideas',f:'Ideas',b:'# Loose ideas\n\n- Dark mode by default\n- Keyboard shortcuts\n- Graph view'}
};
let F;
try{const s=JSON.parse(localStorage.getItem(K));if(s&&s.N){N=s.N;F=s.F||[]}else{const o=JSON.parse(localStorage.getItem('sm-notes-legacy'));if(o)N=o}}catch(e){}
if(!F)F=[...new Set(Object.values(N).map(n=>n.f).filter(Boolean)),'Resources'];
F=[...new Set(F.flatMap(p=>p.split('/').map((_,i,a)=>a.slice(0,i+1).join('/'))))];
const sv=()=>{try{localStorage.setItem(K,JSON.stringify({N,F}))}catch(e){}};
let open=['plan','brief'].filter(i=>N[i]),cur=open[0]||null,mode='ed',q='',col=new Set(),selF='',ren=null,drag=null;

const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const inl=s=>esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/\*([^*]+)\*/g,'<i>$1</i>').replace(/\[\[([^\]]+)\]\]/g,'<a class="wl" data-t="$1">$1</a>').replace(/(^|\s)#([\wáéíóúñ-]+)/gi,'$1<span class="tg">#$2</span>');
function md(t){let h='',u=false,m;const cl=()=>{if(u){h+='</ul>';u=false}};
 for(const l of t.split('\n')){
  if(m=l.match(/^(#{1,3}) (.*)/)){cl();h+=`<h${m[1].length}>${inl(m[2])}</h${m[1].length}>`}
  else if(m=l.match(/^- \[( |x)\] (.*)/)){if(!u){h+='<ul class="tl">';u=true}h+=`<li class="${m[1]=='x'?'dn':''}"><i></i>${inl(m[2])}</li>`}
  else if(m=l.match(/^- (.*)/)){if(!u){h+='<ul>';u=true}h+=`<li>${inl(m[1])}</li>`}
  else if(m=l.match(/^> (.*)/)){cl();h+=`<blockquote>${inl(m[1])}</blockquote>`}
  else{cl();if(l.trim())h+=`<p>${inl(l)}</p>`}}
 cl();return h}

/* ---------- folders and paths ---------- */
const sw=(p,k,np)=>p==k||p.startsWith(k+'/')?np+p.slice(k.length):p;
function repath(k,np){F=F.map(p=>sw(p,k,np));for(const id in N)N[id].f=sw(N[id].f||'',k,np);col=new Set([...col].map(p=>sw(p,k,np)));selF=sw(selF,k,np)}
function expand(p){let a='';p.split('/').filter(Boolean).forEach(s=>{a=a?a+'/'+s:s;col.delete(a)})}
function uniq(base,taken){let n=base,i=2;while(taken(n))n=base+' '+i++;return n}
function tree(){const R={s:{},n:[]};
 const at=p=>{let o=R;p.split('/').filter(Boolean).forEach(s=>{o=o.s[s]=o.s[s]||{s:{},n:[]}});return o};
 if(!q)F.forEach(at);
 for(const id in N){const t=N[id];if(q&&!(t.n+t.b).toLowerCase().includes(q))continue;at(t.f||'').n.push(id)}
 return R}
const nm=(t,k,v)=>ren&&ren.t==t&&ren.k==k?`<input class="rn" value="${esc(v)}">`:`<span class="nx" title="${esc(v)}">${esc(v)}</span>`;
const pen=(t,k)=>ren?'':`<span class="rb" data-rn="${t}:${esc(k)}" title="Rename (double-click or F2)">${ic('pencil',13)}</span>`;
const delF=p=>ren?'':`<span class="rb dl" data-delf="${esc(p)}" title="Delete folder">${ic('trash',13)}</span>`;
const del=id=>ren?'':`<span class="rb dl" data-del="${id}" title="Delete note">${ic('trash',13)}</span>`;
function rows(o,d,path){let h='';
 for(const k of Object.keys(o.s).sort((a,b)=>a.localeCompare(b,'en'))){const p=path?path+'/'+k:k,c=col.has(p)&&!q;
  h+=`<div class="r f ${selF==p?'sel':''}" draggable="${!ren}" style="padding-left:${8+d*16}px" data-fo="${esc(p)}"><span class="ch ${c?'':'o'}">${ic('chev',14)}</span><span style="color:var(--ac);display:flex">${ic('folder',16)}</span>${nm('f',p,k)}${pen('f',p)}${delF(p)}</div>`;
  if(!c)h+=rows(o.s[k],d+1,p)}
 for(const id of o.n.sort((a,b)=>N[a].n.localeCompare(N[b].n,'en')))h+=`<div class="r ${id==cur?'on':''}" draggable="${!ren}" style="padding-left:${8+d*16+22}px" data-id="${id}" data-nf="${esc(path)}">${ic('note',16)}${nm('n',id,N[id].n)}${pen('n',id)}${del(id)}</div>`;
 return h}

/* ---------- render ---------- */
function side(){
 $('#tree').innerHTML=rows(tree(),0,'')||`<div class="em">${q?'No results':'Nothing here yet. Create a note or a folder with the buttons above.'}</div>`;
 $('#tabs').innerHTML=open.map(id=>`<div class="tab ${id==cur?'on':''}" data-id="${id}" draggable="true" title="${esc(N[id].n)}"><span class="tn">${esc(N[id].n)}</span><span class="cx" data-x="${id}">${ic('x',14)}</span></div>`).join('');
 const n=N[cur];$('#bc').innerHTML=n?(n.f?esc(n.f).split('/').join(' › ')+' › ':'')+`<b id="bt" contenteditable="true" spellcheck="false" title="Click to rename">${esc(n.n)}</b>`:'';
 document.querySelectorAll('[data-m]').forEach(b=>b.classList.toggle('on',b.dataset.m==mode));
 $('#dn').style.display=N[cur]?'':'none';
 const i=$('.rn');if(i){i.focus();i.select()}}
function stat(){const n=N[cur];const w=n?(n.b.trim()?n.b.trim().split(/\s+/).length:0):0;$('#st').textContent=n?`${w} words · ${n.b.length} characters · Markdown`:''}
function doc(){const n=N[cur],d=$('#doc');
 if(!n){d.innerHTML='<div class="em">Open a note from the tree or create a new one with the note button</div>';stat();return}
 if(mode=='ed'){d.innerHTML='<textarea id="ta" spellcheck="false"></textarea>';$('#ta').value=n.b}
 else d.innerHTML=`<article>${md(n.b)}</article>`;
 stat()}
const draw=()=>{side();doc()};
function go(id){if(!open.includes(id))open.push(id);cur=id;selF=N[id].f||'';draw()}
function close(id){open=open.filter(i=>i!=id);if(cur==id)cur=open[open.length-1]||null;draw()}

/* ---------- create, rename, move ---------- */
function newNote(){const name=uniq('Untitled',n=>Object.values(N).some(x=>x.n==n&&(x.f||'')==selF));const id='n'+Date.now();
 N[id]={n:name,f:selF,b:'# '+name+'\n\n'};expand(selF);sv();ren={t:'n',k:id};go(id)}
function newFolder(){const name=uniq('New folder',n=>F.includes(selF?selF+'/'+n:n));const p=selF?selF+'/'+name:name;
 F.push(p);expand(selF);selF=p;ren={t:'f',k:p};sv();side()}
function commit(v){if(!ren)return;const r=ren;ren=null;v=(v||'').trim().replace(/[\/"]/g,'-');
 if(v){
  if(r.t=='n'){const n=N[r.k];if(n&&v!=n.n){n.n=v;n.b=n.b.replace(/^# .*/,'# '+v)}}
  else{const k=r.k,i=k.lastIndexOf('/'),par=i<0?'':k.slice(0,i),np=par?par+'/'+v:v;if(np!=k&&!F.includes(np))repath(k,np)}}
 sv();draw()}
function move(d,tp){
 if(d.t=='n'){N[d.k].f=tp;expand(tp);selF=tp}
 else{const k=d.k,base=k.split('/').pop(),pth=n=>tp?tp+'/'+n:n;let nn=base,i=2;
  while(F.includes(pth(nn))&&pth(nn)!=k)nn=base+' '+i++;
  const np=pth(nn);if(np==k)return;repath(k,np);expand(tp);selF=np}
 sv();draw()}

/* ---------- delete with undo ---------- */
let last=null,tt=null;
function toast(msg){const o=$('#ts');if(o)o.remove();clearTimeout(tt);
 const d=document.createElement('div');d.className='toast';d.id='ts';
 const s=document.createElement('span');s.textContent=msg;const b=document.createElement('button');b.id='un';b.textContent='Undo';
 d.append(s,b);document.body.append(d);tt=setTimeout(()=>{d.remove();last=null},8000)}
function delMany(ids,fs,msg){
 last={notes:ids.map(id=>({id,n:N[id],oi:open.indexOf(id)})),fs:fs.slice(),cur,selF,col:[...col]};
 ids.forEach(id=>delete N[id]);F=F.filter(p=>!fs.includes(p));ren=null;
 const oi=open.indexOf(cur);open=open.filter(i=>!ids.includes(i));
 if(cur&&ids.includes(cur))cur=open[Math.min(oi,open.length-1)]||null;
 if(fs.some(p=>selF==p||selF.startsWith(p+'/')))selF='';
 sv();draw();toast(msg)}
function delNote(id){const n=N[id];if(n)delMany([id],[],'Note “'+n.n+'” deleted')}
function delFolder(p){
 const fs=F.filter(x=>x==p||x.startsWith(p+'/'));
 const ids=Object.keys(N).filter(id=>{const f=N[id].f||'';return f==p||f.startsWith(p+'/')});
 delMany(ids,fs,'Folder “'+p.split('/').pop()+'” deleted'+(ids.length?' with '+ids.length+(ids.length==1?' note':' notes'):''))}
function undo(){if(!last)return;const L=last;last=null;
 F.push(...L.fs.filter(p=>!F.includes(p)));
 L.notes.sort((a,b)=>a.oi-b.oi).forEach(o=>{N[o.id]=o.n;if(o.oi>=0)open.splice(Math.min(o.oi,open.length),0,o.id)});
 if(L.cur&&N[L.cur])cur=L.cur;selF=L.selF;col=new Set(L.col);
 const o=$('#ts');if(o)o.remove();sv();draw()}

/* ---------- events ---------- */
document.addEventListener('click',e=>{const t=e.target;let x;
 if(t.closest('.rn')||t.closest('#bt'))return;
 if(x=t.closest('[data-rn]')){const s=x.dataset.rn;ren={t:s[0],k:s.slice(2)};return side()}
 if(x=t.closest('[data-del]'))return delNote(x.dataset.del);
 if(x=t.closest('[data-delf]'))return delFolder(x.dataset.delf);
 if(t.closest('#dn'))return cur&&delNote(cur);
 if(t.closest('#un'))return undo();
 if(x=t.closest('[data-x]'))return close(x.dataset.x);
 if(x=t.closest('[data-id]'))return go(x.dataset.id);
 if(x=t.closest('[data-fo]')){const p=x.dataset.fo;selF=p;col.has(p)?col.delete(p):col.add(p);return side()}
 if(x=t.closest('.wl')){const nm=x.dataset.t,id=Object.keys(N).find(i=>N[i].n.toLowerCase()==nm.toLowerCase());
  if(id)return go(id);const nid='n'+Date.now();N[nid]={n:nm,f:'',b:'# '+nm+'\n\n'};sv();return go(nid)}
 if(x=t.closest('[data-m]')){mode=x.dataset.m;return draw()}
 if(t.closest('#new'))return newNote();
 if(t.closest('#nf'))return newFolder();
 if(t.closest('#tg'))$('#nv').classList.toggle('open')});
document.addEventListener('dblclick',e=>{const r=e.target.closest('#tree .r');if(!r||ren)return;
 ren=r.dataset.id?{t:'n',k:r.dataset.id}:{t:'f',k:r.dataset.fo};side()});
document.addEventListener('input',e=>{
 if(e.target.id=='q'){q=e.target.value.toLowerCase();return side()}
 if(e.target.id=='ta'){const n=N[cur];n.b=e.target.value;const m=n.b.match(/^# (.+)/);if(m)n.n=m[1];sv();side();stat()}});
document.addEventListener('keydown',e=>{
 if(e.target.classList&&e.target.classList.contains('rn')){if(e.key=='Enter')commit(e.target.value);if(e.key=='Escape'){ren=null;draw()}return}
 if(e.target.id=='bt'){if(e.key=='Enter'){e.preventDefault();e.target.blur()}if(e.key=='Escape'){e.target.textContent=N[cur].n;e.target.blur()}return}
 if(e.key=='F2'&&cur&&!ren){e.preventDefault();ren={t:'n',k:cur};side();return}
 if((e.metaKey||e.ctrlKey)&&e.key=='e'){e.preventDefault();mode=mode=='ed'?'rd':'ed';draw()}});
document.addEventListener('focusout',e=>{const t=e.target;
 if(t.classList&&t.classList.contains('rn'))commit(t.value);
 if(t.id=='bt'&&N[cur]){const v=t.textContent.trim().replace(/[\/"]/g,'-'),n=N[cur];
  if(v&&v!=n.n){n.n=v;n.b=n.b.replace(/^# .*/,'# '+v);sv();draw()}else t.textContent=n.n}});

/* ---------- drag and drop ---------- */
const clr=()=>{document.querySelectorAll('.drop,.dg').forEach(x=>x.classList.remove('drop','dg'));$('#tree').classList.remove('droproot')};
function tgt(e){if(!drag||!e.target.closest)return null;
 const f=e.target.closest('#tree [data-fo]'),n=e.target.closest('#tree [data-id]');
 const tp=f?f.dataset.fo:n?n.dataset.nf:(e.target.closest('#tree')?'':null);
 if(tp===null)return null;
 if(drag.t=='f'&&(tp==drag.k||tp.startsWith(drag.k+'/')))return null;
 return tp}
document.addEventListener('dragstart',e=>{const r=e.target.closest&&e.target.closest('#tree .r');if(!r||ren)return;
 drag=r.dataset.id?{t:'n',k:r.dataset.id}:{t:'f',k:r.dataset.fo};
 e.dataTransfer.setData('text/plain',drag.k);e.dataTransfer.effectAllowed='move';setTimeout(()=>r.classList.add('dg'),0)});
document.addEventListener('dragover',e=>{const tp=tgt(e);clr();if(tp===null)return;e.preventDefault();
 if(tp==='')$('#tree').classList.add('droproot');
 else document.querySelectorAll('#tree [data-fo]').forEach(r=>{if(r.dataset.fo==tp)r.classList.add('drop')})});
document.addEventListener('drop',e=>{const tp=tgt(e);if(tp===null)return;e.preventDefault();const d=drag;drag=null;clr();move(d,tp)});
document.addEventListener('dragend',()=>{drag=null;clr()});

/* ---------- reorder tabs ---------- */
let tdrag=null;
const tclr=()=>document.querySelectorAll('.tab').forEach(x=>x.classList.remove('il','ir','tdg'));
const tabAt=e=>e.target.closest?e.target.closest('.tab'):null;
document.addEventListener('dragstart',e=>{const t=tabAt(e);if(!t)return;tdrag=t.dataset.id;
 e.dataTransfer.setData('text/plain',tdrag);e.dataTransfer.effectAllowed='move';setTimeout(()=>t.classList.add('tdg'),0)});
document.addEventListener('dragover',e=>{if(!tdrag)return;const t=tabAt(e),bar=e.target.closest&&e.target.closest('#tabs');
 document.querySelectorAll('.tab').forEach(x=>x.classList.remove('il','ir'));
 if(!bar)return;e.preventDefault();
 if(t&&t.dataset.id!=tdrag){const r=t.getBoundingClientRect();t.classList.add(e.clientX<r.left+r.width/2?'il':'ir')}
 else if(!t){const l=document.querySelector('.tab:last-child');if(l&&l.dataset.id!=tdrag)l.classList.add('ir')}});
document.addEventListener('drop',e=>{if(!tdrag)return;const id=tdrag,t=tabAt(e),bar=e.target.closest&&e.target.closest('#tabs');tdrag=null;
 if(bar){e.preventDefault();
  if(t&&t.dataset.id!=id){const r=t.getBoundingClientRect(),after=e.clientX>=r.left+r.width/2;
   open=open.filter(i=>i!=id);const i=open.indexOf(t.dataset.id);open.splice(after?i+1:i,0,id)}
  else if(!t){open=open.filter(i=>i!=id);open.push(id)}}
 draw()});
document.addEventListener('dragend',()=>{tdrag=null;tclr()});

/* ---------- sidebar width ---------- */
const rz=$('#rz'),sd=$('aside'),SW='notas-sw';
const setW=w=>{w=Math.max(200,Math.min(w,560,innerWidth-420));document.documentElement.style.setProperty('--sw',w+'px')};
try{const w=+localStorage.getItem(SW);if(w)setW(w)}catch(e){}
rz.addEventListener('pointerdown',e=>{e.preventDefault();rz.setPointerCapture(e.pointerId);rz.classList.add('on');document.body.classList.add('rs')});
rz.addEventListener('pointermove',e=>{if(rz.classList.contains('on'))setW(e.clientX-sd.getBoundingClientRect().left)});
const rzEnd=()=>{if(!rz.classList.contains('on'))return;rz.classList.remove('on');document.body.classList.remove('rs');
 try{localStorage.setItem(SW,Math.round(sd.getBoundingClientRect().width))}catch(e){}};
rz.addEventListener('pointerup',rzEnd);rz.addEventListener('pointercancel',rzEnd);
rz.addEventListener('dblclick',()=>{setW(270);try{localStorage.removeItem(SW)}catch(e){}});
draw();
</script></body></html>
