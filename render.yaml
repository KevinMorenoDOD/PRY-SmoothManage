# ==================== RENDER BLUEPRINT: SMOOTH-MANAGE ====================
# Un único Web Service Docker que contiene frontend (nginx) + backend (Spring Boot).
# La base de datos vive en Supabase, NO en Render.
#
# Uso:
#   1. Sube este archivo a la rama main.
#   2. En Render: New -> Blueprint -> selecciona el repositorio.
#   3. Render pedirá los valores marcados con `sync: false` (secretos).
#   4. Cuando termine el deploy, la app queda en https://<nombre>.onrender.com
#
# Documentación detallada: DEPLOY_RENDER.md

services:
  - type: web
    name: smoothmanage
    runtime: docker
    plan: free
    region: oregon
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      # ---------- Spring Boot ----------
      - key: SPRING_PROFILES_ACTIVE
        value: production

      # ---------- Supabase (Session Pooler, puerto 5432) ----------
      # Formato del URL (¡con prefijo jdbc:!):
      #   jdbc:postgresql://aws-0-<region>.pooler.supabase.com:5432/postgres?sslmode=require
      - key: SPRING_DATASOURCE_URL
        sync: false
      # Usuario del pooler, p. ej. postgres.<project-ref>
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false

      # ---------- JWT ----------
      # Render genera y conserva un valor aleatorio; no lo cambies tras el primer deploy
      # o se invalidarán los tokens/sesiones existentes.
      - key: JWT_SIGNING_KEY
        generateValue: true

      # ---------- Correo (Brevo SMTP) ----------
      # Brevo en el puerto 2525: Render free bloquea 25/465/587, pero 2525 sí funciona.
      # Credenciales en Brevo -> Settings -> SMTP & API -> SMTP:
      #   SPRING_MAIL_USERNAME = SMTP login (tu email o ID@smtp-brevo.com)
      #   SPRING_MAIL_PASSWORD = SMTP key (NO es la API key)
      # El remitente (APP_EMAIL_FROM) debe estar verificado en Brevo.
      - key: SPRING_MAIL_HOST
        value: smtp-relay.brevo.com
      - key: SPRING_MAIL_PORT
        value: "2525"
      - key: SPRING_MAIL_USERNAME
        sync: false
      - key: SPRING_MAIL_PASSWORD
        sync: false
      - key: APP_EMAIL_FROM
        sync: false

      # ---------- JVM (plan free: 512 MB) ----------
      - key: JAVA_OPTS
        value: "-XX:MaxRAMPercentage=70 -XX:+UseSerialGC -Dfile.encoding=UTF-8"
