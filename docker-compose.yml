# ==================== DOCKER-COMPOSE PARA DESARROLLO LOCAL ====================
# Presiona Ctrl+C para detener (o usa docker compose down)
# Este archivo es solo para desarrollo local. En producción usarás Render directamente.

services:

  # === BACKEND (Spring Boot) ===
  # La base de datos ahora vive en Supabase (ver application-local.properties).
  backend:
    build: ./smooth-manage-bk
    container_name: smooth-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Se activa el perfil 'local' para que Spring cargue
      # src/main/resources/application-local.properties (JWT, mail, BD, etc.).
      SPRING_PROFILES_ACTIVE: local
    volumes:
      # El archivo está gitignoreado y excluido de la imagen por .dockerignore.
      # Se monta en /app/config para que Spring Boot lo cargue como configuración
      # externa (file:./config/application-local.properties).
      - ./smooth-manage-bk/application-local.properties:/app/config/application-local.properties:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  # === FRONTEND (Vite + React + nginx) ===
  frontend:
    build:
      context: ./smooth-manage-fnt
      args:
        # URL relativa: nginx hace proxy de /api hacia el backend (sin CORS).
        VITE_API_BASE_URL: /api/v1
    container_name: smooth-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
