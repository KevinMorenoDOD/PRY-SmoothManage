# ==================== DOCKER-COMPOSE PARA DESARROLLO LOCAL ====================
# Presiona Ctrl+C para detener (o usa docker-compose down)
# Este archivo es solo para desarrollo local. En producción usarás Render directamente.

version: '3.8'

services:

  # === BASE DE DATOS (PostgreSQL) ===
  db:
    image: postgres:16
    container_name: pg_smoothmanage
    restart: unless-stopped
    environment:
      POSTGRES_USER: smoothmanage
      POSTGRES_PASSWORD: smoothmanage
      POSTGRES_DB: smoothmanage
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - smooth-manage-bk/application-local.properties

  # === BACKEND (Spring Boot) ===
  backend:
    build: ./smooth-manage-bk
    container_name: smooth-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - db
    env_file:
      - smooth-manage-bk/application-local.properties
    environment:
      # Sobrescribir perfil para Docker/Producción
      - SPRING_PROFILES_ACTIVE=docker
      # URL de la BD (Docker usa el nombre del servicio 'db' como hostname)
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/smoothmanage

  # === FRONTEND (Vite + React) ===
  frontend:
    build: ./smooth-manage-fnt
    container_name: smooth-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      # API apuntando al backend dentro de la misma red Docker
      - VITE_API_BASE_URL=http://localhost:8080/api/v1
      # En producción real cambiaremos esto a la URL de Render
      # - VITE_API_BASE_URL=http://tuservicio.onrender.com/api/v1

volumes:
  postgres_data: