# ==================== PERFIL DE PRODUCCIÓN (Render / Docker) ====================
# Todos los valores sensibles se inyectan como variables de entorno.
# Si falta alguna variable obligatoria (${VAR} sin valor por defecto), Spring Boot
# falla al arrancar con un mensaje claro en los logs de Render.

# ---------- Base de datos (Supabase - Session Pooler, puerto 5432) ----------
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# Supabase Session Pooler limita las conexiones; no abras un pool grande.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000

# ---------- JPA / Hibernate ----------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_registration=true
spring.sql.init.mode=never

# ---------- Flyway ----------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ---------- Seguridad / JWT ----------
jwt.signing-key=${JWT_SIGNING_KEY}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# ---------- Aplicación ----------
# RENDER_EXTERNAL_URL lo inyecta Render automáticamente con la URL pública del servicio.
app.frontend.url=${APP_FRONTEND_URL:${RENDER_EXTERNAL_URL:http://localhost:3000}}
app.email.from=${APP_EMAIL_FROM:noreply@smoothmanage.com}

# ---------- Correo SMTP (Brevo) ----------
# Brevo en el puerto 2525: Render free bloquea 25/465/587, pero 2525 sí funciona.
# Usuario = SMTP login de Brevo (tu email o ID@smtp-brevo.com)
# Password = SMTP key de Brevo (NO es la API key ni la contraseña de la cuenta)
spring.mail.host=${SPRING_MAIL_HOST:smtp-relay.brevo.com}
spring.mail.port=${SPRING_MAIL_PORT:2525}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=false
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# ---------- IA (opcional) ----------
spring.ai.deepseek.api-key=${DEEPSEEK_API_KEY:}

# ---------- Servidor / Render ----------
# Spring Boot escucha en 8080 dentro del contenedor; nginx expone $PORT públicamente.
# 127.0.0.1 evita que Render detecte/enrute el 8080 directamente y que el backend
# sea accesible desde fuera del contenedor.
server.port=8080
server.address=127.0.0.1
server.forward-headers-strategy=framework

# ---------- Actuator (health check /healthz -> nginx proxy) ----------
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
# El health check de Render no debe fallar por SMTP (Render puede bloquear esos puertos)
management.health.mail.enabled=false
